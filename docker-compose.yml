version: '3.8'

services:
  deliverabilityos:
    build: .
    container_name: deliverability-os
    ports:
      - "127.0.0.1:3080:3000" # Expose only locally by default on 3080
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app_network
    # Note: To perform SMTP handshakes, this container requires outbound access on port 25.

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    # Caddy will automatically provision HTTPS for the domain via Let's Encrypt
    command: caddy reverse-proxy --from https://$$DOMAIN --to http://deliverabilityos:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network
    depends_on:
      - deliverabilityos

networks:
  app_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
